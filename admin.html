<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理后台 · 天天 Reaction Lab</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="assets/favicon.svg" />
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M16 5l9 5v10l-9 5-9-5V10l9-5z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M16 13v6M12.5 16h7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="brand-text">
      <strong><i>天天</i> REACTION LAB</strong>
      <em>管理后台 · 删除与封禁</em>
    </span>
  </div>
  <div class="top-stats">
    <span class="chip" id="chipBackend">载入中…</span>
    <span class="chip" id="chipWho">未登录</span>
  </div>
  <div class="top-actions">
    <a class="icon-btn" href="index.html" title="返回站点">↩</a>
  </div>
</header>

<main class="admin-wrap">

  <section class="panel" id="loginPanel">
    <div class="panel-head">
      <h2>管理员登录<span class="sub">密码以 bcrypt 哈希存在数据库里，前端不留任何密钥</span></h2>
    </div>
    <div class="login-row">
      <label class="field">
        <span>管理员密码</span>
        <input id="pwd" type="password" autocomplete="current-password" placeholder="在 supabase/admin.sql 里设置的那个密码" />
      </label>
      <button class="btn btn-primary" id="btnLogin" type="button">登录</button>
    </div>
    <div class="field-note" id="loginNote">连续输错 12 次会被锁定 10 分钟。密码只在本次会话中记住。</div>
  </section>

  <div id="console" hidden>

    <section class="panel">
      <div class="panel-head">
        <h2>成绩管理<span class="sub" id="statLine">—</span></h2>
        <div class="head-tools">
          <input class="search" id="search" type="search" placeholder="搜索昵称 / 设备指纹…" autocomplete="off" />
          <button class="btn btn-ghost" id="btnReload" type="button">刷新</button>
          <button class="btn btn-ghost" id="btnLogout" type="button">退出</button>
        </div>
      </div>

      <div class="legend-bar">
        <span>封禁后该昵称与设备都无法再提交成绩；删除只影响已入库的成绩。</span>
      </div>

      <div class="table-wrap admin-table-wrap">
        <table class="board admin-table">
          <thead>
            <tr>
              <th class="c-id">ID</th>
              <th>玩家</th>
              <th class="c-num">平均</th>
              <th class="c-num">最快</th>
              <th class="c-num">抢跑</th>
              <th class="c-month">月份</th>
              <th class="c-dev">设备指纹</th>
              <th class="c-time">提交时间</th>
              <th class="c-act">操作</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden>
          <div class="empty-emoji">🗂️</div>
          <p>还没有任何成绩。</p>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>黑名单<span class="sub">被封禁的昵称或设备无法再提交成绩</span></h2>
      </div>
      <div class="table-wrap admin-table-wrap">
        <table class="board admin-table">
          <thead>
            <tr>
              <th class="c-id">ID</th>
              <th>昵称</th>
              <th class="c-dev">设备指纹</th>
              <th>原因</th>
              <th class="c-time">时间</th>
              <th class="c-act">操作</th>
            </tr>
          </thead>
          <tbody id="bans"></tbody>
        </table>
        <div class="empty" id="banEmpty" hidden>
          <div class="empty-emoji">🕊️</div>
          <p>黑名单是空的。</p>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>修改密码<span class="sub">改完立即生效，下次登录用新密码</span></h2>
      </div>
      <div class="pw-grid">
        <label class="field"><span>当前密码</span><input id="pwOld" type="password" autocomplete="current-password" /></label>
        <label class="field"><span>新密码（至少 6 位）</span><input id="pwNew" type="password" autocomplete="new-password" /></label>
        <label class="field"><span>确认新密码</span><input id="pwNew2" type="password" autocomplete="new-password" /></label>
      </div>
      <button class="btn btn-primary" id="btnChangePwd" type="button">修改密码</button>
      <div class="field-note" id="pwNote"></div>
    </section>
  </div>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/avatars.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
